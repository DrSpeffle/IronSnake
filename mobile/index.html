<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>IronSnake</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="embers" id="embers"></div>


<div class="app">

  <div class="hero">
    <h1>PAIN IS TEMPORARY</h1>
    <h2>PRIDE IS FOREVER</h2>
  </div>

  <div class="scores">

    <div class="score-card">
      <span>Nutrition</span>
      <strong id="nutrition-score">0%</strong>
      <div class="score-bar">
        <div id="nutrition-fill" class="score-fill"></div>
      </div>
    </div>

    <div class="score-card">
      <span>Fitness</span>
      <strong id="fitness-score">0%</strong>
      <div class="score-bar">
        <div id="fitness-fill" class="score-fill"></div>
      </div>
    </div>

    <div class="score-card">
      <span>Strength</span>
      <strong id="strength-score">0%</strong>
      <div class="score-bar">
        <div id="strength-fill" class="score-fill"></div>
      </div>
    </div>

    <div class="score-card">
      <span>Mind</span>
      <strong id="mind-score">0%</strong>
      <div class="score-bar">
        <div id="mind-fill" class="score-fill"></div>
      </div>
    </div>

    <div class="score-card">
      <span>Soul</span>
      <strong id="soul-score">0%</strong>
      <div class="score-bar">
        <div id="soul-fill" class="score-fill"></div>
      </div>
    </div>

  </div>

  <div class="content-panel"
       id="content-panel">
  </div>

</div>

<div class="bottom-nav">
  <button id="nav-character" onclick="showPanel('character')">
    <span class="nav-icon">蛇</span>
    <span>Character</span>
  </button>

  <button id="nav-cooking" onclick="showPanel('cooking')">
    <span class="nav-icon">🍲</span>
    <span>Cooking</span>
  </button>

  <button id="nav-fitness" onclick="showPanel('fitness')">
    <span class="nav-icon">↟</span>
    <span>Fitness</span>
  </button>

  <button id="nav-strength" onclick="showPanel('strength')">
    <span class="nav-icon">拳</span>
    <span>Strength</span>
  </button>

  <button id="nav-mind" onclick="showPanel('mind')">
    <span class="nav-icon">◉</span>
    <span>Mind</span>
  </button>

  <button id="nav-soul" onclick="showPanel('soul')">
    <span class="nav-icon">⛯</span>
    <span>Soul</span>
  </button>
</div>

<script src="app.js"></script>

</body>
</html>
