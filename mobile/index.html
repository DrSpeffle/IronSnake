<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IronSnake</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <div class="hero">
    <h1>PAIN IS TEMPORARY</h1>
    <h2>PRIDE IS FOREVER</h2>
  </div>

  <div class="scores">

    <div class="score-card">
      <span>Nutrition</span>
      <strong>12%</strong>
    </div>

    <div class="score-card">
      <span>Fitness</span>
      <strong>9%</strong>
    </div>

    <div class="score-card">
      <span>Strength</span>
      <strong>6%</strong>
    </div>

    <div class="score-card">
      <span>Mind</span>
      <strong>11%</strong>
    </div>

    <div class="score-card">
      <span>Soul</span>
      <strong>4%</strong>
    </div>

  </div>

  <div class="content-panel" id="content-panel">

    <h3>Character</h3>

    <p>
      XP progression, discipline state,
      recovery state and Snake evolution
      will render here.
    </p>

  </div>

</div>

<div class="bottom-nav">

  <button onclick="showPanel('character')">
    Character
  </button>

  <button onclick="showPanel('cooking')">
    Cooking
  </button>

  <button onclick="showPanel('fitness')">
    Fitness
  </button>

  <button onclick="showPanel('strength')">
    Strength
  </button>

  <button onclick="showPanel('mind')">
    Mind
  </button>

  <button onclick="showPanel('soul')">
    Soul
  </button>

</div>

<script src="app.js"></script>

</body>
</html>
