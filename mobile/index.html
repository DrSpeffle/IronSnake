<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>IronSnake</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="embers" id="embers"></div>

<div class="app">

  <div class="hero">
    <h1>PAIN IS TEMPORARY</h1>
    <h2>PRIDE IS FOREVER</h2>
  </div>

  <div class="overall-panel">

    <span>Overall</span>

    <strong id="overall-score">
      0%
    </strong>

    <div class="overall-bar">
      <div id="overall-fill"
           class="overall-fill">
      </div>
    </div>

  </div>

  <div class="current-quest"
       id="current-quest">
  </div>

  <div class="content-panel"
       id="content-panel">
  </div>

</div>

<div class="bottom-nav">

  <button id="nav-home"
          onclick="showPage('home')">

    <span class="nav-icon">⌂</span>
    <span>Home</span>

  </button>

  <button id="nav-library"
          onclick="showPage('library')">

    <span class="nav-icon">☰</span>
    <span>Library</span>

  </button>

  <button id="nav-cooking"
          onclick="showPage('cooking')">

    <span class="nav-icon">🍲</span>
    <span>Cooking</span>

  </button>

  <button id="nav-workouts"
          onclick="showPage('workouts')">

    <span class="nav-icon">拳</span>
    <span>Workouts</span>

  </button>

  <button id="nav-mind"
          onclick="showPage('mind')">

    <span class="nav-icon">◉</span>
    <span>Mind</span>

  </button>

  <button id="nav-soul"
          onclick="showPage('soul')">

    <span class="nav-icon">⛯</span>
    <span>Soul</span>

  </button>

</div>

<script src="app.js"></script>

</body>
</html>
